name: Publish to npm

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # The tag, package.json version and changelog entry must agree; the release is cut by `bun run pub` (Ship).
      - run: bun ./node_modules/@atom-forge/ship/bin/ship-it.js validate
      - run: bun run prepack
      - run: npm publish --access public --ignore-scripts
